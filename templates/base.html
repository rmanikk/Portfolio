{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}Portfolio{% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{% static 'css/output.css' %}"
    >

    {% block extra_css %}
    {% endblock %}

</head>


<body>

    {% include "partials/navbar.html" %}


    <main>

        {% block content %}
        {% endblock %}

    </main>


    {% include "partials/footer.html" %}


    <script src="{% static 'js/main.js' %}"></script>

    {% block extra_js %}
    {% endblock %}
    <!-- =================================
     FOOTER
================================== -->

<footer class="site-footer">

    <div class="footer-container">

        <!-- Social Links -->
        <div class="footer-socials">

            <!-- LinkedIn -->
            <a
                href="https://www.linkedin.com/"
                class="footer-social-link"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="LinkedIn"
                data-social="LinkedIn"
            >
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="currentColor"
                    aria-hidden="true"
                >
                    <path
                        d="M20.447 20.452h-3.554v-5.569
                        c0-1.328-.027-3.037-1.852-3.037
                        -1.853 0-2.136 1.445-2.136 2.939
                        v5.667H9.351V9h3.414v1.561h.046
                        c.477-.9 1.637-1.85 3.37-1.85
                        3.601 0 4.267 2.37 4.267 5.455
                        v6.286z
                        M5.337 7.433
                        a2.062 2.062 0 1 1 0-4.123
                        2.062 2.062 0 0 1 0 4.123z
                        M3.555 9h3.564v11.452H3.555V9z"
                    />
                </svg>
            </a>


            <!-- Instagram -->
            <a
                href="https://www.instagram.com/"
                class="footer-social-link"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Instagram"
                data-social="Instagram"
            >
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    aria-hidden="true"
                >
                    <rect
                        x="3"
                        y="3"
                        width="18"
                        height="18"
                        rx="5"
                    />

                    <circle
                        cx="12"
                        cy="12"
                        r="4"
                    />

                    <circle
                        cx="17.5"
                        cy="6.5"
                        r="1"
                        fill="currentColor"
                        stroke="none"
                    />
                </svg>
            </a>


            <!-- Gmail -->
            <a
                href="mailto:your-email@gmail.com"
                class="footer-social-link"
                aria-label="Email"
                data-social="Email"
            >
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    aria-hidden="true"
                >
                    <rect
                        x="3"
                        y="5"
                        width="18"
                        height="14"
                        rx="2"
                    />

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M4 7l8 6 8-6"
                    />
                </svg>
            </a>

        </div>


        <!-- Divider -->
        <div class="footer-divider"></div>


        <!-- Copyright -->
        <div class="footer-bottom">

            <p>
                © 2026 Manik Kafle. All rights reserved.
            </p>

        </div>

    </div>

</footer>

</body>

</html>
