{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <script>
    (() => {
        const theme =
            localStorage.getItem("theme");

        if (theme === "light") {
            document.documentElement.classList.add("light");
        }
    })();
</script>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'images/favicon.png' %}?v=2">
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta name="author" content="Manik Kafle">
<meta name="robots" content="index, follow">

<meta
    name="description"
    content="{% block meta_description %}Manik Kafle is a Full-Stack Developer and Computer Engineering student from Nepal, building web applications, software projects, and practical digital experiences.{% endblock %}"
>

<link
    rel="canonical"
    href="{{ request.scheme }}://{{ request.get_host }}{{ request.path }}"
>

<title>
    {% block title %}Manik Kafle | Full-Stack Developer{% endblock %}
</title>

<!-- Open Graph -->
<meta property="og:site_name" content="Manik Kafle">

<meta
    property="og:title"
    content="{% block og_title %}Manik Kafle | Full-Stack Developer{% endblock %}"
>

<meta
    property="og:description"
    content="{% block og_description %}Manik Kafle is a Full-Stack Developer and Computer Engineering student from Nepal.{% endblock %}"
>

<meta
    property="og:url"
    content="{{ request.scheme }}://{{ request.get_host }}{{ request.path }}"
>

<meta
    property="og:type"
    content="{% block og_type %}website{% endblock %}"
>

<meta
    property="og:image"
    content="{% block og_image %}{{ request.scheme }}://{{ request.get_host }}{% static 'images/hero-bg.png' %}{% endblock %}"
>

<!-- Twitter / X -->
<meta name="twitter:card" content="summary_large_image">

<meta
    name="twitter:title"
    content="{% block twitter_title %}Manik Kafle | Full-Stack Developer{% endblock %}"
>

<meta
    name="twitter:description"
    content="{% block twitter_description %}Manik Kafle is a Full-Stack Developer and Computer Engineering student from Nepal.{% endblock %}"
>

<meta
    name="twitter:image"
    content="{{ request.scheme }}://{{ request.get_host }}{% static 'images/hero-bg.png' %}"
>

{% block structured_data %}{% endblock %}

    <link rel="stylesheet" href="{% static 'css/output.css' %}">
<link rel="stylesheet" href="{% static 'css/theme.css' %}">

{% block extra_css %}

</head>


<body>

    {% include "partials/navbar.html" %}


    <main>

        {% block content %}
        {% endblock %}

    </main>


    {% include "partials/footer.html" %}


    <script src="{% static 'js/main.js' %}"></script>

    {% block extra_js %}
    {% endblock %}

</body>

</html>
